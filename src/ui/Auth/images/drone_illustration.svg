<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- soft glow behind the drone -->
  <ellipse cx="240" cy="190" rx="170" ry="90" fill="#FFFFFF" opacity="0.06"/>

  <!-- flight altitude rings -->
  <circle cx="240" cy="190" r="140" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1.5"/>
  <circle cx="240" cy="190" r="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1.5"/>

  <!-- ground grid -->
  <g stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.5">
    <line x1="40"  y1="330" x2="440" y2="330"/>
    <line x1="80"  y1="300" x2="400" y2="300"/>
    <line x1="120" y1="270" x2="360" y2="270"/>
  </g>

  <!-- arms -->
  <g stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" fill="none">
    <line x1="240" y1="185" x2="150" y2="120"/>
    <line x1="240" y1="185" x2="330" y2="120"/>
    <line x1="240" y1="185" x2="150" y2="230"/>
    <line x1="240" y1="185" x2="330" y2="230"/>
  </g>

  <!-- rotors -->
  <g>
    <circle cx="140" cy="112" r="30" fill="none" stroke="#FFFFFF" stroke-width="5"/>
    <circle cx="340" cy="112" r="30" fill="none" stroke="#FFFFFF" stroke-width="5"/>
    <circle cx="140" cy="238" r="30" fill="none" stroke="#FFFFFF" stroke-width="5"/>
    <circle cx="340" cy="238" r="30" fill="none" stroke="#FFFFFF" stroke-width="5"/>

    <g stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.9">
      <line x1="112" y1="112" x2="168" y2="112"/>
      <line x1="140" y1="84"  x2="140" y2="140"/>

      <line x1="312" y1="112" x2="368" y2="112"/>
      <line x1="340" y1="84"  x2="340" y2="140"/>

      <line x1="112" y1="238" x2="168" y2="238"/>
      <line x1="140" y1="210" x2="140" y2="266"/>

      <line x1="312" y1="238" x2="368" y2="238"/>
      <line x1="340" y1="210" x2="340" y2="266"/>
    </g>
  </g>

  <!-- body -->
  <rect x="200" y="165" width="80" height="46" rx="14" fill="#FFFFFF"/>
  <rect x="212" y="177" width="56" height="10" rx="5" fill="#0B2A4A" opacity="0.35"/>

  <!-- landing legs -->
  <g stroke="#FFFFFF" stroke-width="5" stroke-linecap="round">
    <line x1="216" y1="209" x2="200" y2="236"/>
    <line x1="264" y1="209" x2="280" y2="236"/>
  </g>

  <!-- gimbal camera -->
  <circle cx="240" cy="224" r="9" fill="#FFFFFF"/>
  <circle cx="240" cy="224" r="3.5" fill="#0B2A4A"/>
</svg>
